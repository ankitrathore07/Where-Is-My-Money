[project]
name = "where-is-my-money"
version = "0.1.0"
description = "A privacy-conscious personal finance learning project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.9",
    "authlib>=1.6.5",
    "fastapi[standard]>=0.115.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.5",
    "langgraph>=0.6,<2",
    "openai>=2,<3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.0",
    "pypdf>=6.15.0",
    "pypdfium2>=5.12.1",
    "SQLAlchemy>=2.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.12.0",
    "pytest-playwright>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
