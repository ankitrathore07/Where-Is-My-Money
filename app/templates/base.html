<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Where Is My Money?{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Where Is My Money?</a>
      <nav class="site-nav" aria-label="Account navigation">
        {% if current_user %}
          <a href="/workspaces">Workspaces</a>
          {% if workspace is defined %}<a href="/workspaces/{{ workspace.id }}/dashboard">Dashboard</a><a href="/workspaces/{{ workspace.id }}/accounts">Accounts</a><a href="/workspaces/{{ workspace.id }}/transactions">Transactions</a><a href="/workspaces/{{ workspace.id }}/income">Income</a><a href="/workspaces/{{ workspace.id }}/categories">Categories</a>{% endif %}
          <form action="/auth/sign-out" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="link-button" type="submit">Sign out</button>
          </form>
        {% else %}
          <span class="badge">Private by workspace</span>
        {% endif %}
      </nav>
    </header>
    <main class="page-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
