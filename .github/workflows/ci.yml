name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Run Alembic migrations
        env:
          DATABASE_URL: sqlite:///data/where-is-my-money.db
        run: |
          mkdir -p data
          uv run alembic upgrade head || (python -m alembic upgrade head)
      - run: uv run pytest
